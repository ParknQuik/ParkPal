name: Deploy Web Frontend

on:
  push:
    branches:
      - dev
      - qa
      - main
    paths:
      - 'frontend/web/**'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - development
          - staging
          - production

env:
  GCP_PROJECT_ID: parkpal-474417
  GCP_REGION: asia-southeast1
  SERVICE_NAME: parkpal-web

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.determine-env.outputs.environment }}
      service-name: ${{ steps.determine-env.outputs.service-name }}
    steps:
      - name: Determine environment
        id: determine-env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "environment=${{ github.event.inputs.environment }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "environment=production" >> $GITHUB_OUTPUT
          elif [ "${{ github.ref }}" = "refs/heads/qa" ]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
          fi

          # Set service name based on environment
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.ref }}" = "refs/heads/main" ]; then
            ENV="production"
          elif [ "${{ github.ref }}" = "refs/heads/qa" ]; then
            ENV="staging"
          else
            ENV="development"
          fi

          if [ "$ENV" = "production" ]; then
            echo "service-name=parkpal-web-prod" >> $GITHUB_OUTPUT
          elif [ "$ENV" = "staging" ]; then
            echo "service-name=parkpal-web-staging" >> $GITHUB_OUTPUT
          else
            echo "service-name=parkpal-web-dev" >> $GITHUB_OUTPUT
          fi

  build-and-test:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/web/package-lock.json

      - name: Install dependencies
        working-directory: frontend/web
        run: npm ci

      - name: Type check
        working-directory: frontend/web
        run: npm run type-check

      - name: Run tests
        working-directory: frontend/web
        run: npm test

      - name: Build application
        working-directory: frontend/web
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_PAYMONGO_PUBLIC_KEY: ${{ secrets.VITE_PAYMONGO_PUBLIC_KEY }}
          VITE_APP_ENV: ${{ needs.setup.outputs.environment }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: frontend/web/dist
          retention-days: 1

  deploy:
    needs: [setup, build-and-test]
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.setup.outputs.environment }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for GCR
        run: |
          gcloud auth configure-docker

      - name: Build and push Docker image
        working-directory: frontend/web
        run: |
          docker build \
            --build-arg VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }} \
            --build-arg VITE_GOOGLE_MAPS_API_KEY=${{ secrets.VITE_GOOGLE_MAPS_API_KEY }} \
            --build-arg VITE_PAYMONGO_PUBLIC_KEY=${{ secrets.VITE_PAYMONGO_PUBLIC_KEY }} \
            --build-arg VITE_APP_ENV=${{ needs.setup.outputs.environment }} \
            -t gcr.io/${{ env.GCP_PROJECT_ID }}/${{ needs.setup.outputs.service-name }}:latest \
            -t gcr.io/${{ env.GCP_PROJECT_ID }}/${{ needs.setup.outputs.service-name }}:${{ github.sha }} \
            .

          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/${{ needs.setup.outputs.service-name }}:latest
          docker push gcr.io/${{ env.GCP_PROJECT_ID }}/${{ needs.setup.outputs.service-name }}:${{ github.sha }}

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ needs.setup.outputs.service-name }} \
            --image gcr.io/${{ env.GCP_PROJECT_ID }}/${{ needs.setup.outputs.service-name }}:latest \
            --region ${{ env.GCP_REGION }} \
            --platform managed \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 5 \
            --memory 512Mi \
            --cpu 1 \
            --timeout 300 \
            --port 80 \
            --project ${{ env.GCP_PROJECT_ID }}

      - name: Get Cloud Run service URL
        id: get-url
        run: |
          URL=$(gcloud run services describe ${{ needs.setup.outputs.service-name }} \
            --region ${{ env.GCP_REGION }} \
            --project ${{ env.GCP_PROJECT_ID }} \
            --format="value(status.url)")
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "🌐 Service URL: $URL"

      - name: Health check
        run: |
          echo "Waiting 30 seconds for service to stabilize..."
          sleep 30

          URL="${{ steps.get-url.outputs.url }}"

          # Try health check endpoint first
          if curl -f -s --max-time 10 "$URL/health" > /dev/null; then
            echo "✅ Health check passed: $URL/health"
          # Fallback to root endpoint
          elif curl -f -s --max-time 10 "$URL/" > /dev/null; then
            echo "✅ Root endpoint accessible: $URL/"
          else
            echo "❌ Health check failed"
            exit 1
          fi

      - name: Post deployment summary
        run: |
          echo "## 🚀 Web Frontend Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ needs.setup.outputs.service-name }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ steps.get-url.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** gcr.io/${{ env.GCP_PROJECT_ID }}/${{ needs.setup.outputs.service-name }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Configuration" >> $GITHUB_STEP_SUMMARY
          echo "- Region: ${{ env.GCP_REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- Memory: 512Mi" >> $GITHUB_STEP_SUMMARY
          echo "- CPU: 1" >> $GITHUB_STEP_SUMMARY
          echo "- Min instances: 0" >> $GITHUB_STEP_SUMMARY
          echo "- Max instances: 5" >> $GITHUB_STEP_SUMMARY
