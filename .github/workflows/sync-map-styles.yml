name: Sync Google map styles

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check required tokens before changing map resources
        env:
          GH_VARIABLES_TOKEN: ${{ secrets.GH_VARIABLES_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$GH_VARIABLES_TOKEN" ] || [ -z "$EXPO_TOKEN" ]; then
            echo "GH_VARIABLES_TOKEN and EXPO_TOKEN must be configured before map sync."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Validate style files
        run: |
          python3 scripts/sync-map-styles.py --validate
          python3 -m unittest scripts/test_sync_map_styles.py
      - name: Create or update styles and map associations
        env:
          GCP_PROJECT_ID: parkpal-474417
        run: |
          export GOOGLE_MAP_MANAGEMENT_TOKEN="$(gcloud auth print-access-token)"
          python3 scripts/sync-map-styles.py --project "$GCP_PROJECT_ID" --output /tmp/parkpal-map-ids.json
      - name: Configure web Map ID
        env:
          GH_TOKEN: ${{ secrets.GH_VARIABLES_TOKEN }}
        run: |
          web_id="$(python3 -c 'import json; print(json.load(open("/tmp/parkpal-map-ids.json"))["web"])')"
          gh variable set VITE_GOOGLE_MAP_ID --body "$web_id" --repo "$GITHUB_REPOSITORY"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - name: Configure EAS Map IDs
        working-directory: frontend/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npm install --global eas-cli
          android_id="$(python3 -c 'import json; print(json.load(open("/tmp/parkpal-map-ids.json"))["android"])')"
          ios_id="$(python3 -c 'import json; print(json.load(open("/tmp/parkpal-map-ids.json"))["ios"])')"
          for environment in development preview production; do
            eas env:set --environment "$environment" --name EXPO_PUBLIC_GOOGLE_MAP_ID_ANDROID --value "$android_id" --visibility plaintext --non-interactive
            eas env:set --environment "$environment" --name EXPO_PUBLIC_GOOGLE_MAP_ID_IOS --value "$ios_id" --visibility plaintext --non-interactive
          done
      - name: Upload Map IDs for review
        uses: actions/upload-artifact@v4
        with:
          name: map-ids
          path: /tmp/parkpal-map-ids.json
